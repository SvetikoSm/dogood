# DOGOOD — минимальный конфиг nginx (как после certbot)
# sudo bash scripts/install-nginx-dogood.sh

upstream dogood_next {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 443 ssl;
    server_name dogood-brand.ru www.dogood-brand.ru;

    ssl_certificate     /etc/letsencrypt/live/dogood-brand.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dogood-brand.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam           /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location /_next/static/ {
        proxy_pass         http://dogood_next;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    on;
        proxy_read_timeout 180s;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /products/ {
        proxy_pass         http://dogood_next;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_buffering    on;
        proxy_read_timeout 60s;
        add_header Cache-Control "public, max-age=604800, immutable" always;
    }

    location /order-form-styles/ {
        proxy_pass         http://dogood_next;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_buffering    on;
        proxy_read_timeout 60s;
        add_header Cache-Control "public, max-age=604800, immutable" always;
    }

    location / {
        proxy_pass         http://dogood_next;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    on;
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
        send_timeout       180s;
    }
}

server {
    listen 80;
    server_name dogood-brand.ru www.dogood-brand.ru;
    return 301 https://$host$request_uri;
}
