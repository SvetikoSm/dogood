# DOGOOD production — /etc/nginx/sites-available/dogood
# Установка: sudo bash scripts/install-nginx-dogood.sh (из /opt/dogood после git pull)

upstream dogood_next {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    # http/1.1 only — стабильнее для Safari на мобильных сетях
    listen 443 ssl;
    server_name dogood-brand.ru www.dogood-brand.ru;

    ssl_certificate     /etc/letsencrypt/live/dogood-brand.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dogood-brand.ru/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/dogood-brand.ru/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_buffer_size 4k;

    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    client_max_body_size 25m;
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;
    keepalive_timeout 75s;

    location / {
        proxy_pass         http://dogood_next;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }

    location /_next/static/ {
        proxy_pass         http://dogood_next;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        add_header         Cache-Control "public, max-age=31536000, immutable";
    }

    location /products/ {
        proxy_pass         http://dogood_next;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        add_header         Cache-Control "public, max-age=86400";
    }

    location /order-form-styles/ {
        proxy_pass         http://dogood_next;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        add_header         Cache-Control "public, max-age=86400";
    }
}

server {
    listen 80;
    server_name dogood-brand.ru www.dogood-brand.ru;
    return 301 https://dogood-brand.ru$request_uri;
}
